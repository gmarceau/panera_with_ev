[project]
name = "panera-tesla"
version = "0.1.0"
description = "Panera Breads in New England located within walking distance of a Tesla supercharger"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pydash>=8.0",
    "pyyaml>=6.0.3",
    "plumbum>=2.0.2",
    "marimo>=0.24.0",
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
